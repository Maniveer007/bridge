[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

# ── RPC endpoints ────────────────────────────────────────────────────────────
# These are read from environment variables — change the env var to target
# a different chain without touching any code.
[rpc_endpoints]
sepolia    = "${SOURCE_RPC_URL}"
destchain  = "${DEST_RPC_URL}"
local      = "http://127.0.0.1:8545"

